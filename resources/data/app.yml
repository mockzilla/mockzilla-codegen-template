port: 2200
homeURL: /

editor:
  theme: chrome
  darkTheme: cobalt
  fontSize: 14

history:
  enabled: true
  duration: 8h

replay:
  enabled: true
  duration: 24h

## Storage backend: defaults to memory for local development.
## Override with env vars for deployment:
##   STORAGE_TYPE=redis
##   REDIS_HOST=host
##   REDIS_USERNAME=...
##   REDIS_PASSWORD=...
storage:
  type: memory
  redis:
    address: localhost:6379
